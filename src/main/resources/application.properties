# Set the active profile to dev by default, this can be overridden in production
spring.profiles.active=dev

# AI assistant: Groq through Spring AI's OpenAI starter (Groq speaks the OpenAI API format)
# The placeholder key lets the app start without GROQ_API_KEY; model calls then fail and the assistant falls back
spring.ai.openai.api-key=${GROQ_API_KEY:not-configured}
spring.ai.openai.base-url=https://api.groq.com/openai
# llama-3.3-70b-versatile was shut down on Groq's free tier on 16 Aug 2026; gpt-oss-120b is Groq's recommended replacement
spring.ai.openai.chat.options.model=${ASSISTANT_MODEL:openai/gpt-oss-120b}
spring.ai.openai.chat.options.temperature=0.2
# gpt-oss is a reasoning model; low effort keeps answers fast
spring.ai.openai.chat.options.reasoning-effort=low

# Which system prompt file to use: prompts/assistant-<version>.txt
# v2 = v1 with a stronger PIN warning (rule 4). v3 = v2 plus preparing transfers (confirmed with the PIN on a card).
# Saved with every answer, so evaluation scores can be compared.
app.assistant.prompt-version=v3

# Only chat is used; switch off the starter's other models
spring.ai.model.embedding=none
spring.ai.model.image=none
spring.ai.model.audio.speech=none
spring.ai.model.audio.transcription=none
spring.ai.model.moderation=none

# 10 second budget per model call: no retries, and an HTTP timeout on Spring AI's RestClient
spring.ai.retry.max-attempts=1
spring.http.client.connect-timeout=5s
spring.http.client.read-timeout=10s

# Actuator: only health and metrics are switched on.
# /actuator/health is public and only says UP or DOWN; /actuator/metrics is admin-only (SecurityConfig)
management.endpoints.web.exposure.include=health,metrics
management.endpoint.health.show-details=never

# Prices used for the assistant.cost.estimate metric, in US dollars per million tokens.
# Groq's paid price for gpt-oss-120b; the free tier itself costs nothing.
app.assistant.price.input-per-million=0.15
app.assistant.price.output-per-million=0.60

# Virtual cards: the fee taken from the customer's account when they apply (in KES)
app.cards.issue-fee=300
# Key that encrypts card numbers and CVVs: 32 random bytes, Base64-encoded. Keep it secret and never change it,
# or existing cards can't be read. Without it the app runs, but cards can't be issued or shown.
app.cards.encryption-key=${CARD_ENCRYPTION_KEY:}
