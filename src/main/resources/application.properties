# H2 Database Settings (Added DB_CLOSE_DELAY=-1 and PostgreSQL mode)
spring.datasource.url=jdbc:h2:mem:bankdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password

# Enable H2 Web Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Hibernate Settings (Removed spring.jpa.database-platform to let Hibernate auto-detect)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

